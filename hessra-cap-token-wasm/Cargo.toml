[package]
name = "hessra-cap-token-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Jake Valentic <jake@hessra.net>"]
description = "WebAssembly bindings for Hessra capability token verification and designation"
repository = "https://github.com/Hessra-Labs/hessra-tokens"
keywords = ["hessra", "wasm", "capability", "token", "verification"]
categories = ["wasm", "authentication"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hessra-cap-token = { path = "../hessra-cap-token", version = "1.0.0" }
hessra-token-core = { path = "../hessra-token-core", version = "1.0.0" }
biscuit-auth = { workspace = true, features = ["wasm"] }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
